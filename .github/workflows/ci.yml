name: CI

# B-30: 통합 테스트는 4종 DB × 최소·최신 버전 × Quartz 2.3.2/2.5.2 매트릭스(.github/integration-matrix.json, 16조합)다.
# - PR: 각 DB의 최신 버전 × Quartz 2.5.2만(4조합, "pr": true). 개발 흐름을 오래 막지 않게 한다
# - main 머지: 전체 16조합
# - 수동 실행(workflow_dispatch): 기본 전체, scope=pr이면 PR과 같은 4조합
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 통합 테스트 범위
        type: choice
        options: [full, pr]
        default: full

concurrency:
  group: ci-${{ github.ref }}
  # main은 머지마다 전체 결과를 남기고, PR은 새 커밋이 오면 앞 실행을 멈춘다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # 이벤트에 맞는 통합 테스트 조합과, 그 조합에 필요한 Quartz 버전을 고른다
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.pick.outputs.integration }}
      quartz: ${{ steps.pick.outputs.quartz }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - id: pick
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.scope || 'full' }}
        run: |
          jq -c --arg scope "$SCOPE" '[.[] | select($scope == "full" or .pr)]' .github/integration-matrix.json > picked.json
          echo "integration=$(jq -c '{include: .}' picked.json)" >> "$GITHUB_OUTPUT"
          echo "quartz=$(jq -c '[.[].quartz] | unique' picked.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### 통합 테스트 범위: $SCOPE ($(jq length picked.json)조합)"
            jq -r '.[] | "- \(.label) × Quartz \(.quartz)"' picked.json
          } >> "$GITHUB_STEP_SUMMARY"

  # 테스트베드 이미지를 Quartz 버전마다 한 번만 빌드해(빌드 단계에서 JUnit 테스트도 돈다) 통합 테스트 잡에 넘긴다.
  # 레이어는 GitHub Actions 캐시에 남겨 다음 실행에서 Maven 의존성과 빌드를 다시 하지 않는다
  testbed-image:
    name: testbed image (quartz ${{ matrix.quartz }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        quartz: ${{ fromJSON(needs.matrix.outputs.quartz) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: tools/quartz-testbed
          build-args: QUARTZ_VERSION=${{ matrix.quartz }}
          tags: quartz-testbed:${{ matrix.quartz }}
          outputs: type=docker,dest=${{ runner.temp }}/testbed-${{ matrix.quartz }}.tar
          cache-from: type=gha,scope=testbed-${{ matrix.quartz }}
          cache-to: type=gha,mode=max,scope=testbed-${{ matrix.quartz }}

      - uses: actions/upload-artifact@v7
        with:
          name: testbed-image-${{ matrix.quartz }}
          path: ${{ runner.temp }}/testbed-${{ matrix.quartz }}.tar
          retention-days: 1

  integration:
    name: integration (${{ matrix.label }}, quartz ${{ matrix.quartz }})
    needs: [matrix, testbed-image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.integration) }}
    env:
      QA_IT_DB: ${{ matrix.db }}
      QA_IT_QUARTZ_VERSION: ${{ matrix.quartz }}
      QA_IT_TESTBED_IMAGE: quartz-testbed:${{ matrix.quartz }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: testbed-image-${{ matrix.quartz }}
          path: ${{ runner.temp }}

      - name: Load quartz-testbed image
        run: docker load -i "$RUNNER_TEMP/testbed-${{ matrix.quartz }}.tar"

      # DB 버전 변수는 그 DB 것만 둔다(QA_IT_ORACLE_VERSION, QA_IT_POSTGRES_VERSION, QA_IT_MYSQL_VERSION, QA_IT_MARIADB_VERSION)
      - name: Select DB version
        env:
          DB: ${{ matrix.db }}
          VERSION: ${{ matrix.version }}
        run: echo "QA_IT_${DB^^}_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pull ${{ matrix.image }}
        run: docker pull "${{ matrix.image }}"

      - name: Integration test
        env:
          QA_IT_LOG_DIR: ${{ runner.temp }}/it-logs
        run: pnpm turbo run test:integration --filter=@qa/store

      # 실패한 조합만 테스트베드 노드 로그를 남긴다(노드마다 파일 하나)
      - name: Upload testbed logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: it-logs-${{ matrix.db }}-${{ matrix.version }}-quartz-${{ matrix.quartz }}
          path: ${{ runner.temp }}/it-logs
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: container (docker compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 이미지 빌드, compose 기동, 헬스체크, 읽기 전용 파일시스템, 재시작 후 데이터 유지, JSON 로그 (B-07)
      - name: Smoke test
        run: bash docker/smoke.sh
