name: CI

# MVP 기능 개발 동안은 PR마다 돌리지 않는다(실행 시간이 길어 개발 흐름을 막음).
# main에 머지되면 돌고, Actions 화면에서 직접 실행할 수도 있다. PR 트리거와 브랜치 보호의
# 필수 검사(verify)는 MVP 이후 CI/CD를 정리할 때 다시 켠다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  integration-oracle:
    name: integration (oracle, quartz ${{ matrix.quartz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        quartz: ['2.3.2', '2.5.2']
    env:
      QA_IT_QUARTZ_VERSION: ${{ matrix.quartz }}
      QA_IT_TESTBED_IMAGE: quartz-testbed:${{ matrix.quartz }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 빌드 단계에서 testbed의 JUnit 테스트도 함께 돈다
      - name: Build quartz-testbed image
        run: >-
          docker build
          --build-arg QUARTZ_VERSION=${{ matrix.quartz }}
          -t "$QA_IT_TESTBED_IMAGE"
          tools/quartz-testbed

      - name: Pull Oracle Free 23
        run: docker pull gvenzl/oracle-free:23-slim-faststart

      - name: Integration test
        run: pnpm turbo run test:integration --filter=@qa/store

  # B-27: PostgreSQL 최소·최신 버전을 Quartz 두 버전에 하나씩 맞춘다. 전체 조합은 B-30(CI DB 매트릭스)에서
  integration-postgres:
    name: integration (postgres ${{ matrix.postgres }}, quartz ${{ matrix.quartz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '11'
            quartz: '2.3.2'
          - postgres: '17'
            quartz: '2.5.2'
    env:
      QA_IT_DB: postgres
      QA_IT_POSTGRES_VERSION: ${{ matrix.postgres }}
      QA_IT_QUARTZ_VERSION: ${{ matrix.quartz }}
      QA_IT_TESTBED_IMAGE: quartz-testbed:${{ matrix.quartz }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build quartz-testbed image
        run: >-
          docker build
          --build-arg QUARTZ_VERSION=${{ matrix.quartz }}
          -t "$QA_IT_TESTBED_IMAGE"
          tools/quartz-testbed

      - name: Pull PostgreSQL
        run: docker pull postgres:${{ matrix.postgres }}-alpine

      - name: Integration test
        run: pnpm turbo run test:integration --filter=@qa/store

  # MySQL 5.7·8.4 (B-28). 전체 버전 매트릭스는 B-30에서 넓힌다
  integration-mysql:
    name: integration (mysql ${{ matrix.mysql }}, quartz ${{ matrix.quartz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: '5.7'
            quartz: '2.3.2'
          - mysql: '8.4'
            quartz: '2.5.2'
    env:
      QA_IT_DB: mysql
      QA_IT_MYSQL_VERSION: ${{ matrix.mysql }}
      QA_IT_QUARTZ_VERSION: ${{ matrix.quartz }}
      QA_IT_TESTBED_IMAGE: quartz-testbed:${{ matrix.quartz }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build quartz-testbed image
        run: >-
          docker build
          --build-arg QUARTZ_VERSION=${{ matrix.quartz }}
          -t "$QA_IT_TESTBED_IMAGE"
          tools/quartz-testbed

      - name: Pull MySQL
        run: docker pull mysql:${{ matrix.mysql }}

      - name: Integration test
        run: pnpm turbo run test:integration --filter=@qa/store

  container:
    name: container (docker compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 이미지 빌드, compose 기동, 헬스체크, 읽기 전용 파일시스템, 재시작 후 데이터 유지, JSON 로그 (B-07)
      - name: Smoke test
        run: bash docker/smoke.sh
